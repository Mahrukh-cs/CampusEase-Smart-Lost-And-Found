<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Smart Campus Lost & Found System | Create Account </title>
</head>
<body>
    <!--Header Part-->
    <div>
    <header>
        <img src="" alt="Website Logo" height="">
        <h1>Smart Campus Ease Lost & Found System</h1>
    </header>
    </div>

    <!--Registration Form-->
    <form action="" method="post">

        <!--Full Name-->
        <!--for and id value should be match not name used in backend(server side)-->
        <div>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <!--Student Id-->
        <div>
        <label for="student_id">Student ID</label>
        <input type="text" id="student_id" name="student_id" pattern="^(BC|bc)[0-9]{9}$" placeholder="Enter your student id">
        <small style="color:#2482cf;">Format: BC or bc + 9 digits (e.g., BC123456789)</small>
        </div>

        <!--University Email-->
        <div>
        <label for="email">University Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email @vu.edu.pk">
        </div>

        <!--Phone Number-->
        <div>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX" required>
        </div>

        <!--Department Dropdown-->
        <div>
        <label for="department">Department</label>
        <select name="department" id="department" required>
            <option value="" disabled>--Select Department--</option>
            <option value="CS">Computer Science</option>
            <option value="IT">Information Technology</option>
            <option value="SE">Software Engineering</option>
            <option value="FA">Finance & Accounting</option>
            <option value="O">Other</option>
        </select>
        </div>

        <!--Password-->
        <div>
            <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" minlength="8" required>
            </div>

        <div>
            <small>
            <p>Password Requirements:</p>
            <ul>
                <li>At least 8 charcters long</li>
                <li>One uppercase letter (A-Z)</li>
                <li>One lowercase letter (a-z)</li>
                <li>One number (0-9)</li>
                <li>One special charcter (!@#$%&*?)</li>
            </ul>
            </small>
        </div>
        </div>

        <!--Confirm Password-->
        <div>
        <label for="confirmPassword">Confirm Password</label>
        <input type="type" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
        </div>

        <!--Register Button-->
        <button type="submit">Register</button>

        <!--Click Sign in-->
        <div>
            <p>Already have an account? 
                <a href="signin.html">Sign In</a>
            </p>
        </div>
    </form>
</body>
</html>
