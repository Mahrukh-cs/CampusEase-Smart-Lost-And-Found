<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Smart Campus Lost & Found System | Sign in</title>
</head>
<body>
    <!--Sign in Page-->
    <div>
    <!--Login header-->
    <div>
        <h1>Welcome Back</h1>
        <p>Sign in to your Smart Campus Lost & Found System</p>
    </div>

    <!--Login form-->
    <form action="">
        <!--University Email-->
        <div>
            <label for="email">University Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your university email" required>
        </div>

        <!--Password-->
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div>
            <!--remember-me checkbox-->
            <div>
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Remember Me</label>
            </div>
            <!--Forgot password link-->
            <a href="">Forgot Password?</a>
        </div>

        <!--Sign-in button-->
        <button type="submit">Sign In</button>

        <div>
            <!--Sign-up link-->
            <p>
                Don't have an account?
                <a href="/signup.html">Create Account</a>
            </p>
        </div>

    </form>
</div>
</body>
</html>
